services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rfq
      POSTGRES_USER: rfq
      POSTGRES_PASSWORD: rfq-dev-password
    ports:
      - "5432:5432"
    volumes:
      - rfq-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfq -d rfq"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rfq-postgres-data:
